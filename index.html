<!DOCTYPE html>
<html>
<head>
<title>MC Tiers Clone</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #020617;
  color: white;
}

.nav {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
}

.container {
  padding: 10px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  padding: 10px;
  color: #94a3b8;
  text-transform: uppercase;
  font-size: 12px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #1e293b;
  text-align: center;
}

td[contenteditable="true"] {
  background: rgba(255,255,255,0.05);
}

/* COLORS */
.rank { color: gold; font-weight: bold; }
.player { font-weight: bold; }

.ht { color: #c084fc; font-weight: bold; }
.mt { color: #38bdf8; font-weight: bold; }
.lt { color: #4ade80; font-weight: bold; }
.ft { color: #f87171; font-weight: bold; }

button {
  margin: 10px;
  padding: 8px 12px;
  background: #1e293b;
  color: white;
  border: none;
  border-radius: 5px;
}

</style>
</head>

<body>

<div class="nav">⚔️ MC Global Rankings</div>

<div class="container">

<button onclick="saveData()">💾 Save</button>
<button onclick="loadData()">📂 Load</button>

<table id="table">

<tr>
<th>#</th>
<th>Player</th>
<th>Crystal</th>
<th>Sword</th>
<th>Axe</th>
<th>UHC</th>
<th>NethPot</th>
<th>DiaPot</th>
<th>SMP</th>
<th>Overall</th>
</tr>

<tr>
<td contenteditable="true">1</td>
<td contenteditable="true">Click</td>
<td contenteditable="true">HT1</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">LT1</td>
<td contenteditable="true">HT3</td>
<td contenteditable="true">MT1</td>
<td contenteditable="true">LT2</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">HT1</td>
</tr>

<tr>
<td contenteditable="true">2</td>
<td contenteditable="true">Click</td>
<td contenteditable="true">HT2</td>
<td contenteditable="true">HT4</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">LT3</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">MT3</td>
<td contenteditable="true">LT1</td>
<td contenteditable="true">HT2</td>
</tr>

<!-- COPY THIS ROW TO ADD MORE PLAYERS UP TO 15 -->

</table>

</div>

<script>
function saveData() {
  localStorage.setItem("tableData", document.getElementById("table").innerHTML);
  alert("Saved!");
}

function loadData() {
  let data = localStorage.getItem("tableData");
  if(data) {
    document.getElementById("table").innerHTML = data;
  }
}

window.onload = loadData;
</script>

</body>
</html>
