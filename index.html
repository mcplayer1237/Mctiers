<!DOCTYPE html>
<html>
<head>
<title>MC Tiers Clone</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;

  /* 🔥 COOL BACKGROUND */
  background: radial-gradient(circle at top, #0f172a 0%, #020617 70%),
              linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1));
  background-attachment: fixed;
}

/* NAVBAR */
.nav {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
  background: rgba(2,6,23,0.9);
  backdrop-filter: blur(6px);
}

/* TABLE CONTAINER */
.container {
  padding: 15px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  border-radius: 10px;
  overflow: hidden;
}

/* HEADERS */
th {
  padding: 12px;
  color: #94a3b8;
  font-size: 12px;
  background: rgba(15,23,42,0.9);
}

/* CELLS */
td {
  padding: 12px;
  border-bottom: 1px solid #1e293b;
  text-align: center;
}

/* HOVER EFFECT */
tr:hover {
  background: rgba(255,255,255,0.05);
  transition: 0.2s;
}

/* EDITABLE */
td[contenteditable="true"] {
  background: rgba(255,255,255,0.03);
}

/* COLORS */
.rank { color: gold; font-weight: bold; }
.player { font-weight: bold; }

.ht { color: #c084fc; font-weight: bold; }
.mt { color: #38bdf8; font-weight: bold; }
.lt { color: #4ade80; font-weight: bold; }
.ft { color: #f87171; font-weight: bold; }

/* BUTTONS */
button {
  margin: 10px;
  padding: 8px 12px;
  background: #1e293b;
  color: white;
  border: none;
  border-radius: 6px;
}

button:hover {
  background: #334155;
}
</style>

  

  
  





  
  
  



  
  



  
  



  
  
  
  




  


  










  

  

  




</head>

<body>

<div class="nav">⚔️ MC Global Rankings</div>

<div class="container">

<button onclick="saveData()">💾 Save</button>
<button onclick="loadData()">📂 Load</button>

<table id="table">

<tr>
<th>#</th>
<th>Player</th>
<th>Crystal</th>
<th>Sword</th>
<th>Axe</th>
<th>UHC</th>
<th>NethPot</th>
<th>DiaPot</th>
<th>SMP</th>
<th>Overall</th>
</tr>

<tr>
<td contenteditable="true">1</td>
<td contenteditable="true">Click</td>
<td contenteditable="true">HT1</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">LT1</td>
<td contenteditable="true">HT3</td>
<td contenteditable="true">MT1</td>
<td contenteditable="true">LT2</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">HT1</td>
</tr>

<tr>
<td contenteditable="true">2</td>
<td contenteditable="true">Click</td>
<td contenteditable="true">HT2</td>
<td contenteditable="true">HT4</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">LT3</td>
<td contenteditable="true">MT2</td>
<td contenteditable="true">MT3</td>
<td contenteditable="true">LT1</td>
<td contenteditable="true">HT2</td>
</tr>

<!-- COPY THIS ROW TO ADD MORE PLAYERS UP TO 15 -->

</table>

</div>

<script>
function saveData() {
  localStorage.setItem("tableData", document.getElementById("table").innerHTML);
  alert("Saved!");
}

function loadData() {
  let data = localStorage.getItem("tableData");
  if(data) {
    document.getElementById("table").innerHTML = data;
  }
}

window.onload = loadData;
</script>

</body>
</html>
