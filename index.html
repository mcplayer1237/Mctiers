<!DOCTYPE html>
<html>
<head>
<title>MC Tiers Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: radial-gradient(circle at top, #0f172a, #020617);
}

/* NAV */
.nav {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  padding: 10px;
  color: #94a3b8;
  font-size: 12px;
}

td {
  padding: 10px;
  border-bottom: 1px solid #1e293b;
  text-align: center;
}

/* HOVER */
tr:hover {
  box-shadow: 0 0 10px rgba(59,130,246,0.3);
}

/* PLAYER */
.player-name {
  font-weight: bold;
}

/* TITLES */
.title {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 8px;
  display: inline-block;
  margin-top: 4px;
  font-weight: bold;
}

.specialist { color: #facc15; background: rgba(250,204,21,0.2); }
.ace { color: #3b82f6; background: rgba(59,130,246,0.2); }
.master { color: #ef4444; background: rgba(239,68,68,0.2); }
.god { color: #a855f7; background: rgba(168,85,247,0.2); }

/* EDITABLE */
td[contenteditable="true"] {
  background: rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="nav">⚔️ MC Global Rankings</div>

<table>

<tr>
<th>#</th>
<th>Player</th>

<th>Crystal</th><th>Pts</th>
<th>Sword</th><th>Pts</th>
<th>Axe</th><th>Pts</th>
<th>UHC</th><th>Pts</th>
<th>NethPot</th><th>Pts</th>
<th>DiaPot</th><th>Pts</th>
<th>SMP</th><th>Pts</th>

<th>Total</th>
</tr>

<tr>
<td>1</td>
<td>
<div class="player-name">Player1</div>
<div class="title ace">⚔️ Combat Ace</div>
</td>

<td>HT1</td><td contenteditable="true">100</td>
<td>MT2</td><td contenteditable="true">80</td>
<td>LT1</td><td contenteditable="true">60</td>
<td>HT3</td><td contenteditable="true">90</td>
<td>MT1</td><td contenteditable="true">85</td>
<td>LT2</td><td contenteditable="true">70</td>
<td>MT2</td><td contenteditable="true">80</td>

<td contenteditable="true"><b>565</b></td>
</tr>

<tr>
<td>2</td>
<td>
<div class="player-name">Player2</div>
<div class="title master">🔥 Combat Master</div>
</td>

<td>HT2</td><td contenteditable="true">95</td>
<td>HT4</td><td contenteditable="true">70</td>
<td>MT2</td><td contenteditable="true">80</td>
<td>LT3</td><td contenteditable="true">50</td>
<td>MT2</td><td contenteditable="true">80</td>
<td>MT3</td><td contenteditable="true">75</td>
<td>LT1</td><td contenteditable="true">60</td>

<td contenteditable="true"><b>510</b></td>
</tr>

</table>

</body>
  </html>
